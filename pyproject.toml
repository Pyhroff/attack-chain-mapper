[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-chain-mapper"
version = "0.1.0"
description = "Defensive vulnerability intelligence and risk prioritization toolkit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests",
  "click",
  "jinja2",
  "shodan",
  "dnspython",
  "beautifulsoup4",
]

[project.scripts]
attack-chain-mapper = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "utils"]

[tool.setuptools.packages.find]
include = ["recon*", "cve*", "chain*", "report*", "risk*"]
